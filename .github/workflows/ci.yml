name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test -w @sketch/core
      - run: npm test -w @sketch/desktop
      - run: npm run bench:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-benchmark-report
          path: .sketch/bench/*.json
          if-no-files-found: error
