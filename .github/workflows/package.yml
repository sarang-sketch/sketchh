name: Native packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} native package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            command: package:windows
            artifact: packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos
            os: macos-latest
            command: package:macos
            artifact: packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - platform: linux
            os: ubuntu-22.04
            command: package:linux
            artifact: packages/desktop/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build -w @sketch/core
      - run: npm run build:sidecar -w @sketch/desktop
      - run: npm run verify:sidecar -w @sketch/desktop
      - name: Build native Tauri package
        run: npm run ${{ matrix.command }} -w @sketch/desktop
      # Unit tests cannot see a crash at startup (a bad plugin config panics only when the
      # real runtime starts), so the built app is launched once and must stay up.
      - name: Boot smoke test
        if: runner.os != 'Linux'
        run: npm run smoke:boot -w @sketch/desktop
      - name: Boot smoke test (virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a npm run smoke:boot -w @sketch/desktop
      - name: Enforce package size budget
        run: npm run package:size -w @sketch/desktop -- --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sketch-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ matrix.artifact }}
            packages/desktop/src-tauri/target/release/bundle/package-sizes-${{ matrix.platform }}.json
          if-no-files-found: error


  release-gates:
    name: Release behavioral and security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Core tests (provider switch unset)
        run: env -u SKETCH_FAKE_PROVIDER npm test -w @sketch/core
      - name: Desktop tests (provider switch unset)
        run: env -u SKETCH_FAKE_PROVIDER npm test -w @sketch/desktop
      - name: Core tests (fake provider enabled)
        run: npm test -w @sketch/core
        env:
          SKETCH_FAKE_PROVIDER: '1'
      - name: Desktop tests (fake provider enabled)
        run: npm test -w @sketch/desktop
        env:
          SKETCH_FAKE_PROVIDER: '1'
      - name: Benchmark lift regression
        run: npm run bench:check
      - name: Phase 6 registry, scope, and review gates
        run: npm test -w @sketch/core -- phase6-gate.test.ts registry.test.ts registry.seed.test.ts

  release:
    name: Attest and publish release
    needs: [package, release-gates]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: sketch-*-${{ github.sha }}
          path: release-input
      - name: Re-hash and assemble release assets
        run: >-
          node packages/desktop/scripts/assemble-release.mjs
          --input release-input
          --output release-out
          --tag "${GITHUB_REF_NAME}"
          --commit "${GITHUB_SHA}"
          --repository "${GITHUB_REPOSITORY}"
      - name: Attest validated release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-out/*
      - name: Verify provenance before publishing
        run: |
          for asset in release-out/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME" release-out/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Sketch $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
