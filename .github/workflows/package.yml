name: Native packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} native package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            command: package:windows
            artifact: packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos
            os: macos-latest
            command: package:macos
            artifact: packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - platform: linux
            os: ubuntu-22.04
            command: package:linux
            artifact: packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build -w @sketch/core
      - run: npm run build:sidecar -w @sketch/desktop
      - run: npm run verify:sidecar -w @sketch/desktop
      - name: Build native Tauri package
        run: npm run ${{ matrix.command }} -w @sketch/desktop
      - name: Enforce package size budget
        run: npm run package:size -w @sketch/desktop -- --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sketch-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ matrix.artifact }}
            packages/desktop/src-tauri/target/release/bundle/package-sizes-${{ matrix.platform }}.json
          if-no-files-found: error
