<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 644" width="1024" height="644" role="img" aria-label="Sketch Cowork — the agent surface. A left sidebar with New task, Projects, Artifacts, Scheduled, Timeline, Agent Console and Customize, plus recent conversations. The centre asks 'What can I take off your plate?' above a prompt box showing 'No model configured', a 'Work in a project or folder' button, and a task picker.">
  <defs>
    <pattern id="cw-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#242424"/>
    </pattern>
    <linearGradient id="cw-logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#E8631A"/>
    </linearGradient>
    <style>
      .ui   { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }
      .t    { fill: #e6e6e6; }
      .m    { fill: #8b8b8b; }
      .d    { fill: #6a6a6a; }
    </style>
  </defs>

  <rect width="1024" height="644" fill="#141414"/>

  <!-- ── title bar ─────────────────────────────────────────────── -->
  <rect width="1024" height="30" fill="#171717"/>
  <line x1="0" y1="30" x2="1024" y2="30" stroke="#282828"/>

  <g fill="none" stroke="#8b8b8b" stroke-width="1.2">
    <rect x="12" y="10" width="11" height="11" rx="2"/>
    <rect x="33" y="10" width="11" height="11" rx="2"/><line x1="36.5" y1="10" x2="36.5" y2="21"/>
    <circle cx="58" cy="14.5" r="4"/><line x1="61" y1="17.5" x2="64" y2="20.5"/>
  </g>
  <text class="ui m" x="78" y="19" font-size="10">&#8249;</text>
  <text class="ui m" x="92" y="19" font-size="10">&#8250;</text>

  <!-- Cowork / Code toggle: Cowork active -->
  <rect x="112" y="6" width="76" height="18" rx="5" fill="#2f2f2f"/>
  <text class="ui" x="120" y="19" font-size="10.5" fill="#E8631A">&#10022;</text>
  <text class="ui t" x="132" y="19" font-size="10.5" font-weight="600">Cowork</text>
  <text class="mono d" x="196" y="19" font-size="10">&#60;&#62;</text>
  <text class="ui m" x="212" y="19" font-size="10.5">Code</text>

  <text class="ui t" x="512" y="19" font-size="10.5" text-anchor="middle">Sketch</text>

  <text class="ui" x="884" y="19" font-size="10.5" fill="#E8631A">$</text>
  <text class="ui m" x="896" y="19" font-size="10.5">What&#8217;s new</text>
  <g stroke="#9a9a9a" stroke-width="1.1">
    <line x1="963" y1="15" x2="973" y2="15"/>
    <rect x="984" y="10" width="10" height="10" fill="none"/>
    <line x1="1005" y1="10" x2="1015" y2="20"/><line x1="1015" y1="10" x2="1005" y2="20"/>
  </g>

  <!-- ── left sidebar ──────────────────────────────────────────── -->
  <rect x="0" y="30" width="204" height="614" fill="#1a1a1a"/>
  <line x1="204" y1="30" x2="204" y2="644" stroke="#282828"/>

  <rect x="10" y="42" width="184" height="24" rx="6" fill="#262626" stroke="#333"/>
  <text class="ui t" x="20" y="58" font-size="11">+  New task</text>

  <g font-size="11">
    <text class="ui m" x="18" y="96">&#9646;</text><text class="ui t" x="34" y="96">Projects</text>
    <text class="ui m" x="18" y="122">&#9636;</text><text class="ui t" x="34" y="122">Artifacts</text>
    <text class="ui m" x="18" y="148">&#9711;</text><text class="ui t" x="34" y="148">Scheduled</text>
    <text class="ui m" x="18" y="174">&#8767;</text><text class="ui t" x="34" y="174">Timeline</text>
    <text class="ui m" x="18" y="200">&#9646;</text><text class="ui t" x="34" y="200">Agent Console</text>
    <text class="ui m" x="18" y="226">&#9881;</text><text class="ui t" x="34" y="226">Customize</text>
  </g>

  <text class="ui m" x="18" y="262" font-size="10">Recents</text>
  <g stroke="#6a6a6a" stroke-width="1.1">
    <line x1="176" y1="256" x2="188" y2="256"/><line x1="176" y1="260" x2="188" y2="260"/>
    <line x1="176" y1="264" x2="188" y2="264"/>
  </g>

  <text class="ui m" x="18" y="288" font-size="10.5">Setup Sketch Foundation</text>
  <text class="ui m" x="18" y="314" font-size="10.5">Fix React Router Bug</text>
  <rect x="8" y="326" width="188" height="22" rx="5" fill="#2b2b2b"/>
  <text class="ui t" x="18" y="341" font-size="10.5">Refactor UI Components</text>

  <circle cx="24" cy="602" r="9" fill="url(#cw-logo)"/>
  <text class="ui" x="24" y="606" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">S</text>
  <text class="ui t" x="40" y="606" font-size="11">Sketch</text>
  <text class="ui m" x="186" y="606" font-size="9">&#8964;</text>

  <!-- ── main canvas ───────────────────────────────────────────── -->
  <rect x="205" y="31" width="819" height="597" fill="#141414"/>
  <rect x="205" y="31" width="819" height="597" fill="url(#cw-dots)"/>

  <!-- hero -->
  <rect x="368" y="98" width="21" height="21" rx="5" fill="url(#cw-logo)"/>
  <text class="ui" x="378.5" y="113" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">S</text>
  <text class="ui" x="398" y="116" font-size="25" fill="#f2f2f2" font-family="Georgia, serif">What can I take off your plate?</text>
  <text class="ui m" x="614" y="139" font-size="10.5" text-anchor="middle">Learn how to use Cowork safely.</text>

  <!-- prompt card -->
  <rect x="342" y="163" width="544" height="94" rx="11" fill="#1f1f1f" stroke="#2e2e2e"/>
  <text class="ui" x="364" y="192" font-size="12" fill="#7d7d7d">How can I help you today?</text>
  <text class="ui m" x="364" y="234" font-size="14">+</text>
  <rect x="694" y="222" width="140" height="21" rx="6" fill="#2a2a2a" stroke="#363636"/>
  <circle cx="706" cy="232.5" r="2.8" fill="#7d7d7d"/>
  <text class="ui" x="714" y="236" font-size="9.5" fill="#c8c8c8">No model configured</text>
  <text class="ui m" x="826" y="236" font-size="8">&#8964;</text>
  <circle cx="862" cy="232.5" r="11" fill="#2c2c2c" stroke="#3a3a3a"/>
  <path d="M857 232.5 L866 232.5 M862.5 228.5 L866.5 232.5 L862.5 236.5" stroke="#9a9a9a" stroke-width="1.2" fill="none"/>

  <!-- work in a project -->
  <rect x="342" y="271" width="176" height="24" rx="6" fill="#232323" stroke="#333"/>
  <text class="ui m" x="356" y="287" font-size="10">&#9646;</text>
  <text class="ui t" x="370" y="287" font-size="10.5">Work in a project or folder</text>

  <!-- pick a task -->
  <rect x="342" y="322" width="11" height="11" rx="2" fill="#4a90d9"/>
  <text class="ui t" x="360" y="332" font-size="11">Pick a task, any task</text>

  <rect x="342" y="344" width="544" height="126" rx="10" fill="#1c1c1c" stroke="#2a2a2a"/>
  <g>
    <rect x="352" y="352" width="524" height="34" rx="7" fill="#242424"/>
    <rect x="364" y="362" width="14" height="14" rx="3" fill="#e05c3a"/>
    <text class="ui t" x="390" y="374" font-size="11">Optimize my week</text>

    <rect x="352" y="394" width="524" height="34" rx="7" fill="#242424"/>
    <rect x="364" y="404" width="14" height="14" rx="3" fill="#d9a441"/>
    <text class="ui t" x="390" y="416" font-size="11">Organize my screenshots</text>

    <rect x="352" y="436" width="524" height="34" rx="7" fill="#242424"/>
    <rect x="364" y="446" width="14" height="14" rx="3" fill="#4a90d9"/>
    <text class="ui t" x="390" y="458" font-size="11">Find insights in files</text>
  </g>

  <text class="ui d" x="342" y="498" font-size="10">Customize with plugins</text>

  <!-- ── status bar ────────────────────────────────────────────── -->
  <rect x="0" y="628" width="1024" height="16" fill="#171717"/>
  <line x1="0" y1="628" x2="1024" y2="628" stroke="#282828"/>
  <text class="ui" x="934" y="640" font-size="9" fill="#E8631A">&#10022;</text>
  <text class="ui m" x="944" y="640" font-size="9">Cost</text>
  <rect x="978" y="630" width="42" height="12" rx="2" fill="#E8631A"/>
  <text class="ui" x="999" y="639" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">AGENT</text>
</svg>
