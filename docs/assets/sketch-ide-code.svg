<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 635" width="1024" height="635" role="img" aria-label="Sketch IDE — the code surface. An activity bar, the AI TEAM panel showing 5 of 13 roles verifiable with the single, plan-then-code and swarm strategies and a note that swarm is off, a centre pane offering Open Folder and Clone Repository, an allowlisted no-shell terminal, and an Agent sidebar reporting no model configured.">
  <defs>
    <linearGradient id="ide-logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#E8631A"/>
    </linearGradient>
    <style>
      .ui   { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }
      .t { fill: #e6e6e6; }
      .m { fill: #8b8b8b; }
      .d { fill: #6a6a6a; }
    </style>
  </defs>

  <rect width="1024" height="635" fill="#141414"/>

  <!-- ── title bar ─────────────────────────────────────────────── -->
  <rect width="1024" height="22" fill="#171717"/>
  <line x1="0" y1="22" x2="1024" y2="22" stroke="#282828"/>

  <rect x="6" y="4" width="14" height="14" rx="3" fill="url(#ide-logo)"/>
  <text class="ui" x="13" y="15" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">S</text>

  <text class="ui" x="32" y="15" font-size="9.5" fill="#7d7d7d">&#10022;</text>
  <text class="ui m" x="42" y="15" font-size="9.5">Cowork</text>
  <rect x="86" y="3" width="54" height="16" rx="4" fill="#2f2f2f"/>
  <text class="mono" x="93" y="15" font-size="9" fill="#E8631A">&#60;&#62;</text>
  <text class="ui t" x="110" y="15" font-size="9.5" font-weight="600">Code</text>

  <g class="ui m" font-size="9.5">
    <text x="156" y="15">File</text><text x="182" y="15">Edit</text><text x="210" y="15">Selection</text>
    <text x="262" y="15">View</text><text x="292" y="15">Go</text><text x="313" y="15">Run</text>
    <text x="340" y="15">Terminal</text><text x="390" y="15">Help</text>
  </g>

  <text class="ui t" x="512" y="15" font-size="9.5" text-anchor="middle">Sketch IDE</text>

  <g fill="none" stroke="#8b8b8b" stroke-width="1.1">
    <rect x="833" y="6" width="11" height="10" rx="2"/><line x1="833" y1="13" x2="844" y2="13"/>
    <rect x="856" y="6" width="11" height="10" rx="2"/><line x1="861" y1="6" x2="861" y2="16"/>
    <circle cx="882" cy="10" r="3.6"/><line x1="885" y1="13" x2="888" y2="16"/>
    <circle cx="906" cy="11" r="4.2"/><line x1="906" y1="6.8" x2="906" y2="5.4"/>
    <circle cx="929" cy="9" r="3.4"/><path d="M923 16c1.6-2.6 10.4-2.6 12 0"/>
  </g>
  <g stroke="#9a9a9a" stroke-width="1.1">
    <line x1="953" y1="11" x2="962" y2="11"/>
    <rect x="973" y="6" width="10" height="10" fill="none"/>
    <line x1="1000" y1="6" x2="1010" y2="16"/><line x1="1010" y1="6" x2="1000" y2="16"/>
  </g>

  <!-- ── activity bar ──────────────────────────────────────────── -->
  <rect x="0" y="22" width="28" height="613" fill="#181818"/>
  <line x1="28" y1="22" x2="28" y2="635" stroke="#282828"/>
  <g fill="none" stroke="#7d7d7d" stroke-width="1.2">
    <rect x="8" y="44" width="12" height="12" rx="2"/>
    <circle cx="13.5" cy="90" r="4.6"/><line x1="17" y1="93.5" x2="20" y2="96.5"/>
    <circle cx="10" cy="130" r="2.4"/><circle cx="18" cy="138" r="2.4"/><path d="M10 132.4v3.6"/>
    <circle cx="10" cy="172" r="2.4"/><circle cx="18" cy="180" r="2.4"/><path d="M10 174.4v3.6"/>
    <path d="M8 216l6-3 6 3-6 3z"/><path d="M8 222l6 3 6-3"/>
    <path d="M7 260l4 0 2-5 3 9 2-4h5"/>
    <rect x="7" y="298" width="13" height="10" rx="2"/>
    <path d="M9 340l9 5-9 5z"/>
    <path d="M8 386l4 4 8-8"/>
    <path d="M14 424l-5 8h4l-2 7 7-9h-4z"/>
    <circle cx="13.5" cy="472" r="5.4"/><path d="M13.5 469v3.5l2.4 1.4"/>
    <ellipse cx="13.5" cy="510" rx="6" ry="2.4"/><path d="M7.5 510v6c0 1.4 2.7 2.4 6 2.4s6-1 6-2.4v-6"/>
    <circle cx="10" cy="551" r="2.6"/><circle cx="18" cy="551" r="2.6"/>
    <path d="M6 559c0-2.4 2-3.6 4-3.6s4 1.2 4 3.6M14 559c0-2.4 2-3.6 4-3.6"/>
    <path d="M8 596c4 0 8-3 8-8M16 588l3 3"/>
  </g>
  <rect x="0" y="540" width="2" height="24" fill="#E8631A"/>

  <!-- ── AI TEAM panel ─────────────────────────────────────────── -->
  <rect x="29" y="22" width="231" height="613" fill="#1a1a1a"/>
  <line x1="260" y1="22" x2="260" y2="635" stroke="#282828"/>

  <text class="ui m" x="42" y="42" font-size="9" letter-spacing="0.8">AI TEAM</text>

  <text class="ui t" x="42" y="68" font-size="10.5" font-weight="600">5 of 13 roles verifiable in this project</text>
  <text class="ui d" x="42" y="84" font-size="9">Default strategy: <tspan class="mono" fill="#b0b0b0">single</tspan>. Verification</text>
  <text class="ui d" x="42" y="96" font-size="9">contract resolved by none, configuring no</text>
  <text class="ui d" x="42" y="108" font-size="9">stages at all.</text>

  <text class="ui m" x="42" y="136" font-size="8.5" letter-spacing="0.8">STRATEGIES</text>

  <!-- single -->
  <rect x="38" y="148" width="212" height="66" rx="5" fill="#212121" stroke="#2e2e2e"/>
  <text class="mono t" x="48" y="164" font-size="9.5">single</text>
  <rect x="88" y="155" width="46" height="11" rx="2.5" fill="#E8631A"/>
  <text class="ui" x="111" y="163.5" font-size="7" font-weight="700" fill="#fff" text-anchor="middle">DEFAULT</text>
  <text class="ui d" x="48" y="180" font-size="8.5">One agent, one run. The default, and</text>
  <text class="ui d" x="48" y="192" font-size="8.5">what every measurement is compared</text>
  <text class="ui d" x="48" y="204" font-size="8.5">against.</text>

  <!-- plan-then-code -->
  <rect x="38" y="222" width="212" height="78" rx="5" fill="#1e1e1e" stroke="#2a2a2a"/>
  <text class="mono t" x="48" y="238" font-size="9.5">plan-then-code</text>
  <text class="ui d" x="48" y="254" font-size="8.5">A Planner sub-run writes the plan, then</text>
  <text class="ui d" x="48" y="266" font-size="8.5">one implementation run works from it.</text>
  <text class="ui d" x="48" y="278" font-size="8.5">Two runs, so roughly twice the cost of</text>
  <text class="ui d" x="48" y="290" font-size="8.5">single.</text>

  <!-- swarm -->
  <rect x="38" y="308" width="212" height="102" rx="5" fill="#1e1e1e" stroke="#2a2a2a"/>
  <text class="mono t" x="48" y="324" font-size="9.5">swarm</text>
  <text class="ui d" x="48" y="340" font-size="8.5">Every verifiable role runs as its own</text>
  <text class="ui d" x="48" y="352" font-size="8.5">sub-run and their edits are merged</text>
  <text class="ui d" x="48" y="364" font-size="8.5">deterministically. As many runs as</text>
  <text class="ui d" x="48" y="376" font-size="8.5">there are verifiable roles, so as many</text>
  <text class="ui d" x="48" y="388" font-size="8.5">bills. Off by default until measured</text>
  <text class="ui d" x="48" y="400" font-size="8.5">pass@k lift says otherwise.</text>

  <!-- swarm is off callout -->
  <rect x="38" y="418" width="212" height="84" rx="5" fill="#202020" stroke="#2e2e2e"/>
  <rect x="38" y="418" width="2.5" height="84" fill="#E8631A"/>
  <text class="ui t" x="48" y="434" font-size="8.5" font-weight="600">swarm is off <tspan class="ui d" font-weight="400">&#8212; no pass@k</tspan></text>
  <text class="ui d" x="48" y="446" font-size="8.5">measurement has been run in this</text>
  <text class="ui d" x="48" y="458" font-size="8.5">project, so swarm stays off.</text>
  <text class="ui d" x="48" y="470" font-size="8.5">Requirement 24.8: it may only</text>
  <text class="ui d" x="48" y="482" font-size="8.5">become a default for a task class</text>
  <text class="ui d" x="48" y="494" font-size="8.5">after measured pass@k lift over</text>

  <text class="ui m" x="42" y="528" font-size="8.5" letter-spacing="0.8">ROLES</text>
  <rect x="38" y="540" width="212" height="22" rx="4" fill="#1e1e1e" stroke="#2a2a2a"/>
  <text class="ui" x="48" y="555" font-size="8" fill="#4caf7d">&#10003; VERIFIABLE</text>
  <text class="ui t" x="118" y="555" font-size="9.5">CEO</text>

  <!-- ── centre welcome pane ───────────────────────────────────── -->
  <rect x="261" y="22" width="493" height="440" fill="#141414"/>

  <rect x="484" y="146" width="46" height="46" rx="11" fill="url(#ide-logo)"/>
  <text class="ui" x="507" y="177" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">S</text>
  <text class="ui t" x="507" y="220" font-size="19" font-weight="600" text-anchor="middle">Sketch IDE</text>

  <rect x="311" y="245" width="392" height="30" rx="6" fill="#E8631A"/>
  <g fill="none" stroke="#fff" stroke-width="1.3">
    <path d="M462 256h5l1.6 2h6.4v8h-13z"/>
  </g>
  <text class="ui" x="484" y="264" font-size="11" font-weight="600" fill="#fff">Open Folder</text>

  <rect x="311" y="285" width="392" height="30" rx="6" fill="#2a2a2a" stroke="#363636"/>
  <g fill="none" stroke="#c8c8c8" stroke-width="1.2">
    <path d="M455 300l6-3.4 6 3.4-6 3.4z"/><path d="M455 300v4l6 3.4 6-3.4v-4"/>
  </g>
  <text class="ui t" x="476" y="304" font-size="11">Clone Repository</text>

  <!-- ── terminal ──────────────────────────────────────────────── -->
  <line x1="261" y1="462" x2="754" y2="462" stroke="#282828"/>
  <rect x="261" y="462" width="493" height="173" fill="#171717"/>
  <rect x="272" y="466" width="58" height="20" rx="3" fill="#1f1f1f"/>
  <text class="ui t" x="301" y="480" font-size="9.5" text-anchor="middle">Terminal</text>
  <line x1="272" y1="486" x2="330" y2="486" stroke="#E8631A" stroke-width="1.6"/>
  <text class="ui m" x="344" y="480" font-size="11">+</text>
  <text class="ui d" x="700" y="480" font-size="8" text-anchor="end">allowlisted, no shell &#8212; not a sandbox</text>
  <g stroke="#8b8b8b" stroke-width="1.1">
    <line x1="736" y1="472" x2="744" y2="480"/><line x1="744" y1="472" x2="736" y2="480"/>
  </g>
  <line x1="261" y1="492" x2="754" y2="492" stroke="#242424"/>

  <text class="mono d" x="272" y="514" font-size="9">No folder is open, so there is no project to run a command in.</text>
  <text class="mono d" x="272" y="528" font-size="9">Open one from the Explorer first.</text>
  <text class="mono" x="272" y="612" font-size="9" fill="#7d7d7d">$ Open a folder to run a command</text>

  <!-- ── agent sidebar ─────────────────────────────────────────── -->
  <rect x="755" y="22" width="269" height="613" fill="#1a1a1a"/>
  <line x1="755" y1="22" x2="755" y2="635" stroke="#282828"/>

  <text class="ui t" x="770" y="44" font-size="10.5" font-weight="600">Agent</text>
  <text class="ui m" x="936" y="44" font-size="12">+</text>
  <text class="ui m" x="958" y="44" font-size="10">&#8635;</text>
  <text class="ui m" x="980" y="44" font-size="10">&#8230;</text>
  <g stroke="#8b8b8b" stroke-width="1.1">
    <line x1="1002" y1="38" x2="1010" y2="46"/><line x1="1010" y1="38" x2="1002" y2="46"/>
  </g>
  <line x1="755" y1="56" x2="1024" y2="56" stroke="#242424"/>

  <text class="ui" x="770" y="86" font-size="12" fill="#E8631A">$</text>
  <text class="ui t" x="786" y="86" font-size="14" font-weight="600">Sketch</text>

  <!-- composer -->
  <line x1="755" y1="352" x2="1024" y2="352" stroke="#242424"/>
  <rect x="766" y="364" width="246" height="72" rx="8" fill="#1f1f1f" stroke="#2e2e2e"/>
  <text class="ui" x="778" y="384" font-size="9.5" fill="#6f6f6f">Ask anything, @ to mention, / for actions</text>
  <text class="ui m" x="778" y="416" font-size="12">+</text>
  <rect x="798" y="405" width="132" height="19" rx="5" fill="#2a2a2a" stroke="#363636"/>
  <circle cx="808" cy="414.5" r="2.6" fill="#7d7d7d"/>
  <text class="ui" x="816" y="418" font-size="8.5" fill="#c8c8c8">No model configured</text>
  <text class="ui m" x="922" y="418" font-size="7.5">&#8964;</text>
  <rect x="982" y="404" width="20" height="20" rx="5" fill="#2c2c2c" stroke="#3a3a3a"/>
  <path d="M988 414h9 M993 410l4 4-4 4" stroke="#9a9a9a" stroke-width="1.1" fill="none"/>

  <text class="ui d" x="889" y="452" font-size="8" text-anchor="middle">AI may make mistakes. Double check all generated code.</text>

  <!-- ── status bar ────────────────────────────────────────────── -->
  <rect x="0" y="619" width="1024" height="16" fill="#171717"/>
  <line x1="0" y1="619" x2="1024" y2="619" stroke="#282828"/>
  <g class="ui m" font-size="8.5">
    <text x="784" y="631">TSX</text>
    <text x="812" y="631">Ln 42, Col 15</text>
    <text x="882" y="631">UTF-8</text>
    <text x="918" y="631">4.2 KB</text>
  </g>
  <text class="ui" x="954" y="631" font-size="8.5" fill="#E8631A">&#10022;</text>
  <text class="ui m" x="964" y="631" font-size="8.5">Cost</text>
  <rect x="994" y="621" width="26" height="12" rx="2" fill="#E8631A"/>
  <text class="ui" x="1007" y="630" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">IDE</text>
</svg>
