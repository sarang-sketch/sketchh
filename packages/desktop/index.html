<!DOCTYPE html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sketch — The Open-Source AI Software Engineering Platform" />
    <!-- No font CDN, and no `preconnect` to one. Inter and JetBrains Mono are
         vendored as woff2 files in this package and declared in
         src/styles/fonts.css, so the window makes no request off this machine on
         load. A `preconnect` hint is not covered by any CSP directive, which is why
         removing it mattered rather than relying on the policy. See PRIVACY.md §3. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sketch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
